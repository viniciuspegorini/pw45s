filebeat.inputs:
  - type: log
    paths:
      - /usr/share/filebeat/logs/*.json
    # Configuração recomendada pela Elastic para logs no formato ECS (Elastic Common Schema)
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    json.expand_keys: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "spring-api-logs-%{+yyyy.MM.dd}"

setup.template.name: "spring-api-logs"
setup.template.pattern: "spring-api-logs*"
setup.template.overwrite: true
# Os campos do MDC são gravados como texto; mapeados como número para permitir filtros (status >= 500)
# e agregações (tempo médio de resposta) no Kibana
setup.template.append_fields:
  - name: status
    type: long
  - name: durationMs
    type: long

setup.kibana:
  host: "http://kibana:5601"
