########################### SERVICES
services:
  api:
    image: pw45s-server
    container_name: pw45s-server
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      #Server Config
      - SERVER_PORT=${SERVER_PORT}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      #Database
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      #Google Oauth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      #Storage (S3 compatível: RustFS, MinIO...)
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_PORT=${STORAGE_PORT}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_SECURE=${STORAGE_SECURE}
      - STORAGE_BUCKET_NAME=${STORAGE_BUCKET_NAME}
      #Observabilidade (OpenTelemetry)
      - OTLP_ENABLED=${OTLP_ENABLED:-false}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-http://localhost:4318}
      #Time Zone
      - TZ=America/Sao_Paulo
    ports:
      - "8080:8080"
    restart: unless-stopped
    labels:
      # Traefik Config
      - "traefik.enable=true"
      - "traefik.http.routers.pw45s-server.rule=Host(`api.viniciuspegorini.com.br`)"
      - "traefik.http.routers.pw45s-server.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pw45s-server.entrypoints=websecure"
      - "traefik.http.services.pw45s-server.loadbalancer.server.port=8080"
    networks:
      - web
      - database

########################### NETWORKS
networks:
  web:
    name: web
    driver: bridge
    external: true
    attachable: true
  database:
    name: database
    driver: bridge
    external: false
    attachable: true
