server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A aplicação utiliza o BrowserRouter (React Router): rotas como /products não existem como arquivo,
    # então qualquer caminho não encontrado é respondido com o index.html e o React Router exibe a página
    location / {
        try_files $uri $uri/ /index.html;
    }
}
