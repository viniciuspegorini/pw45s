########################### SERVICES
services:
  ########################### RUSTFS - armazenamento de objetos compatível com S3
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: rustfs
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - TZ=America/Sao_Paulo
    volumes:
      - ./appdata/rustfs/data:/data
    ports:
      - 8000:9000 # API S3
      - 8001:9001 # Console web
    labels: # Configs for traefik
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.constraint-label=web
      - traefik.http.routers.rustfs.service=rustfs
      - traefik.http.routers.rustfs.rule=Host(`rustfs.${DOMAIN}`)
      - traefik.http.routers.rustfs.entrypoints=websecure
      - traefik.http.routers.rustfs.tls.certresolver=letsencrypt
      - traefik.http.services.rustfs.loadbalancer.server.port=9000
      - traefik.http.routers.rustfs-console.service=rustfs-console
      - traefik.http.routers.rustfs-console.rule=Host(`rustfs-console.${DOMAIN}`)
      - traefik.http.services.rustfs-console.loadbalancer.server.port=9001
      - traefik.http.routers.rustfs-console.entrypoints=websecure
      - traefik.http.routers.rustfs-console.tls.certresolver=letsencrypt
    networks:
      - web
      - database
    restart: unless-stopped

########################### NETWORKS
networks:
  web:
    name: web
    driver: bridge
    external: true
    attachable: true
  database:
    name: database
    driver: bridge
    external: false
    attachable: true
